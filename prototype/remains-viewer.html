<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>원장 진엔딩 경로 뷰어</title>
<style>
  :root {
    --ink-deep: #0a0d11; --ink: #202833; --slate: #8892a0; --ash: #aeb8c2;
    --parchment: #f4f7f9; --ember: #ff6a1a; --sky: #5aa0ea; --dusk: #4d5866;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ink-deep); color: var(--parchment);
    font-family: "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    line-height: 1.7; padding: 0 0 80px 0; word-break: keep-all;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 20px 0 20px; }
  h1 { font-size: 24px; margin: 0 0 6px 0; }
  .sub { font-size: 13px; color: var(--slate); margin: 0 0 14px 0; }
  .bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  #status { font-size: 13px; color: var(--ash); }
  #status.err { color: var(--ember); }
  label.file {
    border: 2px solid var(--slate); padding: 6px 12px; font-size: 13px; cursor: pointer;
    min-height: 44px; display: inline-flex; align-items: center; gap: 8px;
  }
  label.file:hover { border-color: var(--ember); }
  label.file input { display: none; }
  .meta { font-size: 12px; color: var(--dusk); margin: 10px 0 26px 0; }
  .route { border: 2px solid var(--ink); margin: 0 0 28px 0; padding: 18px; }
  .route h2 { font-size: 18px; margin: 0 0 2px 0; }
  .route .tag { font-size: 12px; color: var(--slate); margin-bottom: 14px; }
  .chart { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 14px 0; }
  .node {
    border: 2px solid var(--slate); background: var(--ink); padding: 8px 12px;
    font-size: 13px; max-width: 260px;
  }
  .node.gap { border-style: dashed; border-color: var(--sky); color: var(--sky); font-weight: 700; }
  .edge { color: var(--ember); font-size: 16px; padding: 0 2px; }
  .edge.dashed { color: var(--sky); letter-spacing: -2px; }
  .steps { margin: 10px 0 0 0; padding-left: 20px; font-size: 13px; color: var(--ash); }
  .steps li { margin-bottom: 4px; }
  .ending { font-size: 13px; margin-top: 12px; }
  .ending b { color: var(--ember); font-weight: 400; }
  details { margin-top: 12px; }
  summary { font-size: 12px; color: var(--slate); cursor: pointer; }
  pre { overflow: auto; border: 1px solid var(--dusk); padding: 12px; font-size: 12px; color: var(--ash); }
  .empty { color: var(--slate); font-size: 14px; }
  .hint { font-size: 12px; color: var(--dusk); margin-top: 30px; border-top: 1px solid var(--dusk); padding-top: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>원장 진엔딩 경로 뷰어</h1>
  <p class="sub">prototype/remains.json → <code>trueEndingRoutes</code> 의 머메이드 차트를 그립니다.</p>
  <div class="bar">
    <span id="status">불러오는 중…</span>
    <label class="file">다른 JSON 열기<input id="file" type="file" accept=".json,application/json"></label>
  </div>
  <div class="meta" id="meta"></div>
  <main id="routes"></main>
  <p class="hint">
    기본값은 같은 폴더의 <code>remains.json</code> 자동 로드입니다(정적 서버 필요). 파일로 직접 열었다면
    “다른 JSON 열기”를 쓰거나 JSON 파일을 창에 끌어다 놓으세요. 다른 경로를 보려면 주소에 <code>?src=경로</code>를 붙이면 됩니다.
    점선 노드 <b>?</b> 는 아직 이어지지 않은 구간입니다.
  </p>
</div>
<script type="module">
const OPERATORS = { "-->": false, "-.->": true };
const NODE_RE = /^([A-Za-z0-9_]+)(?:\["([^"]*)"\]|\[([^\]]*)\])?$/;

const el = (tag, className, text) => {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
};

const parseMermaid = (src) => {
  const labels = new Map();
  const edges = [];
  for (const raw of String(src).split("\n")) {
    let prev = null;
    let dashed = false;
    const line = raw.trim();
    if (line === "" || /^(flowchart|graph)\b/.test(line)) continue;
    for (const token of line.split(/(-->|-\.->)/)) {
      const t = token.trim();
      if (t === "") continue;
      if (t in OPERATORS) { dashed = OPERATORS[t]; continue; }
      const m = NODE_RE.exec(t);
      if (!m) return { error: `해석할 수 없는 조각: ${t}` };
      const id = m[1];
      if (!labels.has(id)) labels.set(id, m[2] ?? m[3] ?? id);
      if (prev !== null) edges.push({ from: prev, to: id, dashed });
      prev = id;
      dashed = false;
    }
  }
  return { labels, edges };
};

const MAX_PATHS = 16;
const MAX_DEPTH = 60;

const toPaths = ({ labels, edges }) => {
  const ids = [...labels.keys()];
  if (ids.length === 0) return null;
  const out = new Map(ids.map((id) => [id, []]));
  const incoming = new Map(ids.map((id) => [id, null]));
  for (const edge of edges) {
    out.get(edge.from).push(edge);
    if (incoming.get(edge.to) === null) incoming.set(edge.to, edge);
  }
  const roots = ids.filter((id) => incoming.get(id) === null);
  if (roots.length === 0) return null;
  const paths = [];
  const visited = new Set();
  const walk = (start) => {
    const stack = [{ id: start, steps: [{ id: start, edge: incoming.get(start) }] }];
    while (stack.length > 0 && paths.length <= MAX_PATHS) {
      const { id, steps } = stack.pop();
      visited.add(id);
      const next = out.get(id);
      if (next.length === 0 || steps.length >= MAX_DEPTH) {
        paths.push(steps);
        continue;
      }
      for (const edge of next) {
        if (steps.some((step) => step.id === edge.to)) continue;
        stack.push({ id: edge.to, steps: [...steps, { id: edge.to, edge }] });
      }
    }
  };
  for (const root of roots) walk(root);
  for (const id of ids) if (!visited.has(id)) walk(id);
  return { paths, truncated: paths.length > MAX_PATHS };
};

const resolveRef = (root, ref) => ref.split(".").reduce((o, k) => (o == null ? o : o[k]), root);

const renderRoute = (root, key, route) => {
  const section = el("section", "route");
  const name = root?.settings?.characters?.[key]?.name ?? key;
  section.append(el("h2", null, `${name} · ${key}`), el("div", "tag", `endNodeRef: ${route.endNodeRef ?? "없음"}`));

  const parsed = parseMermaid(route.mermaid ?? "");
  if (parsed.error) {
    section.append(el("p", "empty", `차트 해석 실패 — ${parsed.error}`));
  } else {
    const graph = toPaths(parsed);
    if (!graph) {
      section.append(el("p", "empty", "차트를 해석하지 못했습니다(순환 또는 빈 그래프). 원문을 확인하세요."));
    } else {
      const shown = graph.paths.slice(0, MAX_PATHS);
      let gaps = 0;
      let cards = 0;
      for (const steps of shown) {
        const row = el("div", "chart");
        for (const { id, edge } of steps) {
          if (edge) {
            row.append(el("span", `edge${edge.dashed ? " dashed" : ""}`, edge.dashed ? "-⇢" : "→"));
          }
          const label = parsed.labels.get(id);
          const isGap = label.trim() === "?";
          if (isGap) gaps += 1;
          cards += 1;
          row.append(el("div", `node${isGap ? " gap" : ""}`, label));
        }
        section.append(row);
      }
      const tag = shown.length > 1
        ? `분기 ${shown.length}개 경로로 펼침 · 노드 ${cards}개 · 미확정 구간 ${gaps}곳`
        : `노드 ${cards}개 · 미확정 구간 ${gaps}곳`;
      section.append(el("div", "tag", tag + (graph.truncated ? ` · 최대 ${MAX_PATHS}개까지만 표시` : "")));
      const inCount = new Map();
      for (const edge of parsed.edges) inCount.set(edge.to, (inCount.get(edge.to) ?? 0) + 1);
      for (const [id, label] of parsed.labels) {
        const count = inCount.get(id) ?? 0;
        if (label.trim() === "?" && count > 1) {
          section.append(el("p", "empty", `주의: 미확정 노드 '${id}'가 ${count}곳에서 참조됩니다 — Q1, Q2처럼 ID를 나누세요.`));
        }
      }
    }
  }

  if (Array.isArray(route.steps)) {
    const list = el("ol", "steps");
    for (const step of route.steps) list.append(el("li", null, step));
    section.append(list);
  }

  const ending = route.endNodeRef ? resolveRef(root, route.endNodeRef) : undefined;
  if (typeof ending === "string") {
    const p = el("p", "ending");
    p.append(el("b", null, "진엔딩: "), document.createTextNode(ending));
    section.append(p);
  }

  const details = el("details");
  details.append(el("summary", null, "머메이드 원문"), el("pre", null, route.mermaid ?? ""));
  section.append(details);
  return section;
};

const render = (root, sourceLabel) => {
  const status = document.getElementById("status");
  const routesRoot = document.getElementById("routes");
  const meta = document.getElementById("meta");
  routesRoot.replaceChildren();
  const domain = root?.trueEndingRoutes;
  if (!domain || typeof domain.routes !== "object" || domain.routes === null) {
    status.className = "err";
    status.textContent = "trueEndingRoutes.routes 를 찾지 못했습니다. 최상위 키: " +
      Object.keys(root ?? {}).join(", ");
    meta.textContent = "";
    return;
  }
  status.className = "";
  const keys = Object.keys(domain.routes);
  status.textContent = `${sourceLabel} — 경로 ${keys.length}개`;
  meta.textContent = `status: ${domain.status ?? "—"} · legend: ${domain.legend ?? "—"}`;
  for (const key of keys) routesRoot.append(renderRoute(root, key, domain.routes[key]));
};

const loadText = (text, sourceLabel) => {
  try {
    render(JSON.parse(text), sourceLabel);
  } catch (error) {
    const status = document.getElementById("status");
    status.className = "err";
    status.textContent = `JSON 파싱 실패 — ${error.message}`;
  }
};

const loadFile = (file) => {
  const reader = new FileReader();
  reader.onload = () => loadText(String(reader.result), file.name);
  reader.readAsText(file);
};

document.getElementById("file").addEventListener("change", (event) => {
  const file = event.target.files?.[0];
  if (file) loadFile(file);
});

document.addEventListener("dragover", (event) => event.preventDefault());
document.addEventListener("drop", (event) => {
  event.preventDefault();
  const file = event.dataTransfer?.files?.[0];
  if (file) loadFile(file);
});

const params = new URLSearchParams(location.search);
const source = params.get("src") ?? "remains.json";
fetch(source)
  .then((response) => {
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    return response.text();
  })
  .then((text) => loadText(text, source))
  .catch((error) => {
    const status = document.getElementById("status");
    status.className = "err";
    status.textContent = `자동 로드 실패(${error.message}) — “다른 JSON 열기”로 이 파일을 선택하세요.`;
  });
</script>
</body>
</html>
